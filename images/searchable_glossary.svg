<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background circle -->
  <circle cx="200" cy="150" r="100" fill="#1a3566" />
  
  <!-- Simple open book -->
  <path d="M140 110 L260 110 L260 200 C230 185, 170 185, 140 200 Z" fill="#2c4a80" stroke="#4488dd" stroke-width="3" />
  <path d="M200 110 L200 200" stroke="#4488dd" stroke-width="1" />
  
  <!-- Simple magnifying glass -->
  <circle cx="230" cy="140" r="20" fill="none" stroke="#5599ee" stroke-width="3" />
  <line x1="245" y1="155" x2="260" y2="170" stroke="#5599ee" stroke-width="4" stroke-linecap="round" />
  
  <!-- Blood drop symbol -->
  <path d="M170 130 Q170 115, 180 105 Q190 95, 200 105 Q210 115, 210 130 Q210 145, 190 155 Q170 145, 170 130 Z" fill="#e01414" />
  
  <!-- Letter D for Diabetes -->
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">D</text>
  
  <!-- Few simple text lines on book -->
  <line x1="155" y1="135" x2="185" y2="135" stroke="#6699cc" stroke-width="1.5" />
  <line x1="155" y1="145" x2="175" y2="145" stroke="#6699cc" stroke-width="1.5" />
  <line x1="155" y1="155" x2="180" y2="155" stroke="#6699cc" stroke-width="1.5" />
  
  <line x1="215" y1="135" x2="245" y2="135" stroke="#6699cc" stroke-width="1.5" />
  <line x1="215" y1="145" x2="240" y2="145" stroke="#6699cc" stroke-width="1.5" />
  <line x1="215" y1="155" x2="235" y2="155" stroke="#6699cc" stroke-width="1.5" />
</svg>
